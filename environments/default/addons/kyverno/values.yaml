# Kyverno Helm chart (https://kyverno.github.io/kyverno) — consumed by addons-kyverno ApplicationSet.
# Aligned with provi-eks-workloads envs/provi/*/templates/kyverno.yaml for chart 3.6.1 / app v1.16.1.

crds:
  migration:
    enabled: false

# Chart 3.1.x only: post-upgrade hook + CronJobs used docker.io/bitnami/kubectl:1.28.5 (tag removed).
# If Argo is still on 3.1.x briefly, these prevent those pulls. Chart 3.6.x ignores these keys.
policyReportsCleanup:
  enabled: false

cleanupJobs:
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false

webhooksCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.34.3

admissionController:
  replicas: 3

backgroundController:
  replicas: 3

cleanupController:
  replicas: 3

reportsController:
  replicas: 3

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
